# EnterpriseRAG: app, worker, postgres (+pgvector) and, optionally, a bundled Ollama.
#
#   docker compose up -d --build                 # app + worker + postgres; Ollama on the host
#   docker compose --profile ollama up -d        # also run Ollama in a container (NVIDIA GPU via CDI)
#
# See docs/adr/0006-ollama-on-host.md for why the host Ollama is the default.
name: enterprise-rag

x-app-env: &app-env
  ERAG_ENV: ${ERAG_ENV:-dev}
  ERAG_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-erag}:${POSTGRES_PASSWORD:-erag}@postgres:5432/${POSTGRES_DB:-erag}
  ERAG_SECRET_KEY: ${ERAG_SECRET_KEY:-dev-insecure-secret-change-me}
  ERAG_MCP_CONTEXT_SECRET: ${ERAG_MCP_CONTEXT_SECRET:-dev-insecure-mcp-secret-change-me}
  ERAG_OLLAMA_BASE_URL: ${ERAG_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  ERAG_LOCAL_CHAT_MODEL: ${ERAG_LOCAL_CHAT_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
  # Credential store master key (ADR 0018). In dev the file is generated on first start; in prod create
  # it with `erag secrets init --file ...` (or set ERAG_SECRETS_KEY) and keep a backup outside the database.
  ERAG_SECRETS_KEY_FILE: ${ERAG_SECRETS_KEY_FILE:-/data/secrets.key}
  # `erag init` puts the master key here instead (it takes precedence over the file).
  ERAG_SECRETS_KEY: ${ERAG_SECRETS_KEY:-}
  # Bootstrap fallback only: once the key is in the credential store (Admin > Providers, or
  # `erag secrets set openrouter_api_key --from-env ERAG_OPENROUTER_API_KEY`), remove it from here.
  ERAG_OPENROUTER_API_KEY: ${ERAG_OPENROUTER_API_KEY:-}
  ERAG_OPENROUTER_MODEL: ${ERAG_OPENROUTER_MODEL:-meta-llama/llama-3.3-8b-instruct:free}
  ERAG_OPENROUTER_MONTHLY_BUDGET_USD: ${ERAG_OPENROUTER_MONTHLY_BUDGET_USD:-0.01}
  # Metered providers (ADR 0024, 0026): initial defaults for the monthly ceiling (USD), the daily request cap and
  # the maximum output tokens per request. Admins may lower or raise them per provider (step-up, audited).
  ERAG_PROVIDER_MONTHLY_BUDGET_USD: ${ERAG_PROVIDER_MONTHLY_BUDGET_USD:-0.01}
  ERAG_PROVIDER_DAILY_REQUEST_CAP: ${ERAG_PROVIDER_DAILY_REQUEST_CAP:-100}
  ERAG_PROVIDER_MAX_OUTPUT_TOKENS: ${ERAG_PROVIDER_MAX_OUTPUT_TOKENS:-2048}
  ERAG_CLOUD_MAX_CLASSIFICATION: ${ERAG_CLOUD_MAX_CLASSIFICATION:-internal}
  ERAG_COOKIE_SECURE: ${ERAG_COOKIE_SECURE:-false}
  ERAG_BLOB_DIR: /data/blobs
  # Folder connectors may only read below these roots (mounted read-only below). ADR 0020.
  ERAG_CONNECTOR_ROOTS: ${ERAG_CONNECTOR_ROOTS:-/connectors}
  # Non-public destinations that web connectors / remote MCP servers may reach (host, host:port, CIDR).
  ERAG_SSRF_ALLOWLIST: ${ERAG_SSRF_ALLOWLIST:-mcp-office:8791}
  # Demo: a "third-party" MCP server registered as pending on first start (Admin > MCP registry).
  ERAG_DEMO_OFFICE_MCP_URL: ${ERAG_DEMO_OFFICE_MCP_URL:-http://mcp-office:8791/mcp}
  # Isolated MCP runner (ADR 0022). The app only knows its URL and token, never the Docker socket.
  ERAG_RUNNER_URL: ${ERAG_RUNNER_URL:-http://runner:8790}
  ERAG_RUNNER_TOKEN: ${ERAG_RUNNER_TOKEN:-dev-insecure-runner-token}
  ERAG_RUNNER_SOCKET_DIR: ${ERAG_RUNNER_SOCKET_DIR:-/tmp/erag-runner-sockets}
  ERAG_MCP_TICKETS_DB: /data/tickets.sqlite3
  # A fresh installation starts in setup mode (the wizard); choose "Demo with mock data" there to explore ACME Corp.
  # ERAG_SEED_DEMO=true seeds the full demo (including admin@acme.test) at start-up for development and
  # scripts/demo_scenarios.py, and counts as a completed setup; ignored in production (ADR 0040).
  ERAG_SEED_DEMO: ${ERAG_SEED_DEMO:-false}
  ERAG_DEMO_PASSWORD: ${ERAG_DEMO_PASSWORD:-acme-demo-password}
  # Setup (ADR 0034): the SHA-256 of the token printed by `erag init`; without it a token is generated at first
  # start and written to the log and to /data/setup-token (mode 0600).
  ERAG_SETUP_TOKEN_SHA256: ${ERAG_SETUP_TOKEN_SHA256:-}
  APP_PORT: ${APP_PORT:-8000}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erag}
      POSTGRES_DB: ${POSTGRES_DB:-erag}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erag"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 1g

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${ERAG_IMAGE:-enterprise-rag:dev}
    environment: *app-env
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli bootstrap && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"]
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - appdata:/data
      - ../demo/acme/connector-source:/connectors/acme:ro
      # Unix sockets of runner-managed MCP containers (same path on the host and in the containers).
      - ${ERAG_RUNNER_SOCKET_DIR:-/tmp/erag-runner-sockets}:${ERAG_RUNNER_SOCKET_DIR:-/tmp/erag-runner-sockets}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g

  worker:
    image: ${ERAG_IMAGE:-enterprise-rag:dev}
    environment: *app-env
    command: ["python", "-m", "app.cli", "worker"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - appdata:/data
      - ../demo/acme/connector-source:/connectors/acme:ro
    depends_on:
      app:
        condition: service_started
    mem_limit: 768m

  # Demo remote MCP server (no access to the database or the app). In production, MCP servers run in
  # the isolated runner (R5) or elsewhere; this one only exists so the registry can be tried.
  mcp-office:
    image: ${ERAG_IMAGE:-enterprise-rag:dev}
    command: ["python", "-m", "mcp_servers.office_server", "--http", "0.0.0.0:8791"]
    depends_on:
      app:
        condition: service_started
    mem_limit: 256m

  # The only service with the Docker socket (root-equivalent). Narrow, token-authenticated API; it only
  # starts images pinned by ID in ERAG_RUNNER_IMAGES, e.g. office=sha256:... (see README). Not published.
  runner:
    image: ${ERAG_IMAGE:-enterprise-rag:dev}
    user: root
    command: ["python", "-m", "app.runner.service"]
    environment:
      ERAG_RUNNER_LISTEN: 0.0.0.0:8790
      ERAG_RUNNER_TOKEN: ${ERAG_RUNNER_TOKEN:-dev-insecure-runner-token}
      ERAG_RUNNER_IMAGES: ${ERAG_RUNNER_IMAGES:-}
      ERAG_RUNNER_SOCKET_DIR: ${ERAG_RUNNER_SOCKET_DIR:-/tmp/erag-runner-sockets}
      ERAG_RUNNER_MOUNT_ROOTS: ${ERAG_RUNNER_MOUNT_ROOTS:-}
      ERAG_LOG_JSON: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${ERAG_RUNNER_SOCKET_DIR:-/tmp/erag-runner-sockets}:${ERAG_RUNNER_SOCKET_DIR:-/tmp/erag-runner-sockets}
    mem_limit: 256m

  ollama:
    image: ollama/ollama:0.12.3
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    devices:
      - nvidia.com/gpu=all
    ports:
      - "127.0.0.1:11435:11434"

volumes:
  pgdata:
  appdata:
  ollama:

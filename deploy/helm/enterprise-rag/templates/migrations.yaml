{{- if .Values.migrations.enabled }}
# Runs before install and before every upgrade, with the direct database URL (not PgBouncer). Migrations are
# expand/contract, so the previous release keeps serving while this runs; a migration that cannot be
# (it declares REQUIRES_DOWNTIME, e.g. 0018) is called out in the upgrade notes: scale the app to 0 first.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "erag.name" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "erag.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "erag.selector" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: migrate
          image: {{ include "erag.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "ERAG_DATABASE_URL=\"$ERAG_DB_DIRECT_URL\" alembic upgrade head"]
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.existingSecret }}
          {{- include "erag.security" . | nindent 10 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}

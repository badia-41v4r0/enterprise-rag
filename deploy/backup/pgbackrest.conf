# pgBackRest (MIT) for EnterpriseRAG: continuous WAL archiving, encrypted base backups, point-in-time recovery.
# Targets (PLAN-v0.5 decision 6): RPO 15 minutes, RTO 4 hours. See docs/operations/backup.md.
#
# Postgres needs, in postgresql.conf:
#   archive_mode = on
#   archive_command = 'pgbackrest --stanza=erag archive-push %p'
#   archive_timeout = 300          # a WAL segment at least every 5 min: well within the 15 min RPO
#   wal_level = replica
#
# Nightly full or differential backups (cron or a Kubernetes CronJob):
#   pgbackrest --stanza=erag --type=full backup      # Sunday
#   pgbackrest --stanza=erag --type=diff backup      # other days

[global]
# An S3-compatible bucket, separate from the blob bucket, with versioning and object lock if available.
repo1-type=s3
repo1-path=/erag
repo1-s3-bucket=CHANGE-ME-backups
repo1-s3-endpoint=CHANGE-ME-s3.example.internal
repo1-s3-region=us-east-1
repo1-s3-uri-style=path
# repo1-s3-key / repo1-s3-key-secret: from the environment (PGBACKREST_REPO1_S3_KEY, ..._KEY_SECRET).
# Encrypted at rest by pgBackRest itself. Keep this passphrase with the EnterpriseRAG master key backup, NOT
# with the backups: whoever has both can read everything.
repo1-cipher-type=aes-256-cbc
# repo1-cipher-pass: from the environment (PGBACKREST_REPO1_CIPHER_PASS).
repo1-retention-full=4
repo1-retention-diff=7
process-max=4
compress-type=zst
compress-level=3
start-fast=y
log-level-console=info

[erag]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=erag

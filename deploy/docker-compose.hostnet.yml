# Override for hosts where Ollama only listens on 127.0.0.1 (the default for a host install).
# app and worker share the host network so they can reach http://127.0.0.1:11434.
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.hostnet.yml up -d --build
#
# With host networking the app listens directly on 127.0.0.1:${APP_PORT:-8000}.
services:
  app:
    network_mode: host
    ports: !reset []
    extra_hosts: !reset []
    environment:
      ERAG_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-erag}:${POSTGRES_PASSWORD:-erag}@127.0.0.1:${POSTGRES_HOST_PORT:-55432}/${POSTGRES_DB:-erag}
      ERAG_OLLAMA_BASE_URL: http://127.0.0.1:11434
      ERAG_SSRF_ALLOWLIST: 127.0.0.1:8791
      ERAG_DEMO_OFFICE_MCP_URL: http://127.0.0.1:8791/mcp
      ERAG_RUNNER_URL: http://127.0.0.1:8790
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli bootstrap && uvicorn app.main:app --host 127.0.0.1 --port ${APP_PORT:-8000}"]
  runner:
    network_mode: host
    environment:
      ERAG_RUNNER_LISTEN: 127.0.0.1:8790
  mcp-office:
    network_mode: host
    command: ["python", "-m", "mcp_servers.office_server", "--http", "127.0.0.1:8791"]
  worker:
    network_mode: host
    extra_hosts: !reset []
    environment:
      ERAG_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-erag}:${POSTGRES_PASSWORD:-erag}@127.0.0.1:${POSTGRES_HOST_PORT:-55432}/${POSTGRES_DB:-erag}
      ERAG_OLLAMA_BASE_URL: http://127.0.0.1:11434

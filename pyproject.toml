[project]
name = "enterprise-rag"
version = "0.1.0.dev0"
description = "Permission-aware RAG + MCP reference implementation (source-available, PolyForm Noncommercial 1.0.0)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mcp>=2.3.0",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pyotp>=2.10.0",
    "pypdf>=7.0.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "segno>=1.6.6",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app", "mcp_servers", "demo"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pip-licenses>=5.5.5",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "types-jsonschema>=4.26.0.20261006",
]

[project.scripts]
erag = "app.cli:main"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["frontend", ".scratch"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "ASYNC", "RUF", "SIM"]
ignore = ["S101", "B008", "RUF012", "S311", "S608", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app", "mcp_servers", "demo", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S603", "S607"]
"backend/migrations/**" = ["E501"]
"backend/app/llm/prompt_builder.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
packages = ["app", "mcp_servers", "demo"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["pgvector.*", "docx.*", "openpyxl.*", "argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
  "db: needs the PostgreSQL test database (skipped when unreachable)",
  "embeddings: needs the local Ollama embedding model bge-m3 (skipped when unreachable)",
  "provider_ollama: real Ollama chat provider test (skipped when unreachable)",
  "provider_openrouter: real OpenRouter test (skipped without ERAG_OPENROUTER_API_KEY)",
  "provider_claude_code: real `claude -p` test (opt-in: ERAG_RUN_CLAUDE_CODE_TESTS=1)",
  "docker: needs a real Docker daemon (isolated runner tests; skipped when unreachable)",
]

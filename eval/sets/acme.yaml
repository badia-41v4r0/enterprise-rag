# ACME evaluation set (ADR 0048).
#
# Every item runs once per persona in `as_users`, with that persona's real permissions. Per persona:
#   documents     container/filename keys that should be retrieved (empty = nothing relevant exists for them)
#   match         all (default: recall over every listed document) or any (one of them is enough; for questions
#                 that several near-identical documents answer)
#   answerable    defaults to true when documents are listed; false means the right outcome is "no source"
#   must_not_see  documents this persona must never get; any of them retrieved fails the whole run
# Independently of must_not_see, every retrieved document is checked against the declared structure
# (app.eval.corpus.Oracle), so a leak is caught even if nobody wrote it down here.
include:
  - acme.generated.yaml

items:
  # --- ACME handbook and security basics (Employee) -----------------------------------------------------
  - id: hw-001
    question: How many vacation days do employees get per year?
    as_users: [newhire@acme.test]
    expect:
      newhire@acme.test: { documents: [general-handbook/employee-handbook.md] }
    tags: [paraphrase, en]
